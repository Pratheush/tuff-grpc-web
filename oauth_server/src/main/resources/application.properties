## The name of your Spring Boot application
#spring.application.name=oauth_server
#
## Port where the authorization server will run
#server.port=8082
#
##spring.datasource.driver-class-name=org.postgresql.Driver
##spring.datasource.url=jdbc:postgresql://localhost:5432/oauth
##spring.datasource.username=oauth
##spring.datasource.password=oauth
##
##spring.jpa.show-sql=true
##spring.jpa.generate-ddl=true
##spring.jpa.hibernate.ddl-auto=update
#
##spring.security.oauth2.authorizationserver.client.id=oauth_client
##spring.security.oauth2.authorizationserver.client.secret=oauth_secret
##spring.security.oauth2.authorizationserver.client.scope=openid,profile,email
##spring.security.oauth2.authorizationserver.client.auto-approve=true
##spring.security.oauth2.authorizationserver.client.grant-types=authorization_code,refresh_token
##spring.security.oauth2.authorizationserver.client.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
#
## === Client Registration Settings ===
## ? Easy way to understand:
## client-id / client-secret ? like a username/password for the client app.
## client-authentication-methods ? how the client proves its identity (here, Basic Auth).
## authorization-grant-types ? which OAuth2 flows are allowed (login + refresh).
## redirect-uris ? where the server sends the user back after login.
## scopes ? what kind of data the client can access (identity, profile, etc.).
#
## authorization server (port 8082) issues tokens to a client app (port 8081).
## The client identifies itself with client-id=spring and client-secret=spring,
## uses the authorization code flow, and can request openid + profile scopes.
#
## Unique identifier for the client application (used by the client to identify itself)
#spring.security.oauth2.authorizationserver.client.oidc-client.registration.client-id=spring
#
## Secret used by the client to authenticate with the authorization server
## {noop} means "no password encoder" (plain text). In production, use a stronger encoder.
#spring.security.oauth2.authorizationserver.client.oidc-client.registration.client-secret={noop}spring
#
## How the client will send its credentials to the server
## "client_secret_basic" means the client ID and secret are sent via HTTP Basic Auth headers
#spring.security.oauth2.authorizationserver.client.oidc-client.registration.client-authentication-methods=client_secret_basic
#
## Which OAuth2 grant types this client is allowed to use
## "authorization_code" ? standard login flow with redirect
## "refresh_token" ? allows client to refresh expired access tokens
#spring.security.oauth2.authorizationserver.client.oidc-client.registration.authorization-grant-types=authorization_code,refresh_token
#
##spring.security.oauth2.authorizationserver.client.oidc-client.registration.redirect-uris={baseUrl}/login/oauth2/code/{registrationId}
#
## Redirect URI where the authorization server will send the authorization code
## This must match exactly what the client app expects (here, client runs on port 8081)
## client will be running on 8081
#spring.security.oauth2.authorizationserver.client.oidc-client.registration.redirect-uris=http://127.0.0.1:8081/login/oauth2/code/spring
#
## Scopes define what information/resources the client can request
## "openid" ? required for OpenID Connect (basic identity info)
## "profile" ? allows access to user profile information
#spring.security.oauth2.authorizationserver.client.oidc-client.registration.scopes=openid,profile
