<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Stock UI</title>

    <!--<link rel="stylesheet" th:href="@{/css/stocks.css}">-->
    <link rel="stylesheet" href="css/stocks.css">

    <style>
        .hidden { display: none; }

        /* ===== SLIDER TOGGLE ===== */
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .label-text {
            font-weight: bold;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }

        .switch input { display: none; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 30px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: linear-gradient(to right, #ff6ec4, #7873f5);
        }

        input:checked + .slider:before {
            transform: translateX(30px);
        }

        /* ===== BUTTONS ===== */
        .action-btn {
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 8px;
            background: linear-gradient(to right, #ff6ec4, #7873f5);
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .delete-btn {
            background: linear-gradient(to right, #ff4d4d, #cc0000);
        }

        .form-group {
            margin-bottom: 10px;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #f5f5f5;
        }
    </style>

    <script>
        function toggleMode() {
            const toggle = document.getElementById("modeToggle");

            const lookupSection = document.getElementById("lookupSection");
            const addSection = document.getElementById("addSection");

            if (toggle.checked) {
                // ADD MODE
                lookupSection.classList.add("hidden");
                addSection.classList.remove("hidden");
            } else {
                // LOOKUP MODE
                lookupSection.classList.remove("hidden");
                addSection.classList.add("hidden");
            }
        }

        function handleLookupInput() {
            const input = document.getElementById("stockSymbol").value;
            document.getElementById("submitBtn").style.display =
                input ? "block" : "none";
        }

        function handleAddInput() {
            const name = document.getElementById("addName").value;
            const price = document.getElementById("addPrice").value;
            const currency = document.getElementById("addCurrency").value;

            const btn = document.getElementById("addSubmitBtn");

            btn.style.display = (name && price && currency) ? "block" : "none";
        }
    </script>
</head>

<body>

<div class="stock-container">

    <h2>Stock Management</h2>

    <!-- ===== SLIDER TOGGLE ===== -->
    <div class="toggle-container">
        <span class="label-text">Lookup</span>

        <label class="switch">
            <input type="checkbox" id="modeToggle" onchange="toggleMode()">
            <span class="slider"></span>
        </label>

        <span class="label-text">Add</span>
    </div>

    <!-- ================= LOOKUP ================= -->
    <div id="lookupSection">

        <form th:action="@{/client}" method="get">
            <div class="form-group">
                <label>Stock Symbol</label>
                <input type="text" id="stockSymbol" name="stockSymbol"
                       onkeyup="handleLookupInput()" required>
            </div>

            <button type="submit" id="submitBtn"
                    class="action-btn hidden">Submit</button>
        </form>

        <!-- RESULT + DELETE -->
        <div class="result-box"
             th:if="${stockResponse != null and stockResponse.stockName != null}">

            <p><strong>User:</strong> <span th:text="${stockResponse.authenticationName}"></span></p>
            <p><strong>Symbol:</strong> <span th:text="${stockResponse.stockName}"></span></p>
            <p><strong>Price:</strong> <span th:text="${stockResponse.price}"></span></p>
            <p><strong>Currency:</strong> <span th:text="${stockResponse.currency}"></span></p>
            <p><strong>Last Updated:</strong> <span th:text="${stockResponse.timestamp}"></span></p>

            <form th:action="@{/client/delete}" method="post">
                <input type="hidden" name="stockSymbol"
                       th:value="${stockResponse.stockName}">
                <button type="submit" class="action-btn delete-btn">
                    Delete Stock
                </button>
            </form>

        </div>
    </div>

    <!-- ================= ADD ================= -->
    <div id="addSection" class="hidden">

        <form th:action="@{/client/add}" method="post">

            <div class="form-group">
                <label>Stock Symbol</label>
                <input type="text" id="addName" name="stockName"
                       onkeyup="handleAddInput()" required>
            </div>

            <div class="form-group">
                <label>Price</label>
                <input type="number" step="0.01" id="addPrice"
                       name="price" onkeyup="handleAddInput()" required>
            </div>

            <div class="form-group">
                <label>Currency</label>
                <input type="text" id="addCurrency"
                       name="currency" onkeyup="handleAddInput()" required>
            </div>

            <button type="submit" id="addSubmitBtn"
                    class="action-btn hidden">
                Add Stock
            </button>

        </form>
    </div>

</div>

</body>
</html>
