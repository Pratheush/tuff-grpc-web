# ===============================
# APPLICATION INFO
# ===============================
# Logical service name
spring.application.name=stock_trading_client


# This would configure a default gRPC channel to localhost:9090 if uncommented.
# You are instead creating the channel manually in StockClientConfig.
#spring.grpc.client.default-channel.address=static://localhost:9090

# ===============================
# SERVER CONFIG
# ===============================
# gRPC client setup
# spring.grpc.client.default-channel.address=static://localhost:9090
# Client runs here
server.port=8081
# Disable gRPC server (this is client only)
spring.grpc.server.enabled=false

# ===============================
# LOGGING
# ===============================
# Debugging security logs
# Shows OAuth2 login + token flow (very useful for debugging)
# Print detailed Spring Security logs for troubleshooting OAuth2 login
logging.level.org.springframework.security=DEBUG



# ===============================
# OAUTH2 PROVIDER (AUTH SERVER)
# ===============================
# this is the off-server
# OAuth2 Authorization Server (issuer) location
# ? Problem (Redundant): issuer-uri= , authorization-uri= , token-uri= ,jwk-set-uri=  ? Best Practice: Use ONLY: my-oidc-client.issuer-uri=http://localhost:8082
# ? Spring auto-discovers endpoints via .well-known/openid-configuration
# This enables auto-discovery of:
# /authorize, /token, /jwks, /userinfo
# Base issuer URI of your oauth_server
spring.security.oauth2.client.provider.my-oidc-client.issuer-uri=http://localhost:8082
# These URIs must match the endpoints exposed by your oauth_server.
# They tell the client where to redirect for authorization, where to fetch tokens, and how to validate JWTs.
#spring.security.oauth2.client.provider.my-oidc-client.authorization-uri=http://localhost:8082/oauth2/authorize
#spring.security.oauth2.client.provider.my-oidc-client.token-uri=http://localhost:8082/oauth2/token
#spring.security.oauth2.client.provider.my-oidc-client.jwk-set-uri=http://localhost:8082/oauth2/jwks
#spring.security.oauth2.client.provider.my-oidc-client.user-info-uri=http://localhost:8082/oauth2/userinfo
spring.security.oauth2.client.provider.my-oidc-client.user-name-attribute=sub


# ===============================
# CLIENT REGISTRATION
# ===============================
# Client registration details
# this is the client side image that we configured
# These must match the client registration in your oauth_server.
# Client ID and secret identify this client.
# Grant type is authorization_code (standard).
# Scopes requested are openid and user.read.
spring.security.oauth2.client.registration.my-oidc-client.provider=my-oidc-client
spring.security.oauth2.client.registration.my-oidc-client.client-id=oidc-stock-trading-client
# Must match OAuth server config
spring.security.oauth2.client.registration.my-oidc-client.client-secret=client-secret
# we dont use encoded password at client side instead we supply raw password
#spring.security.oauth2.client.registration.my-oidc-client.client-secret=$2a$12$/LrnbY9hRk.sji4s3gEL.OkKlzUVejuXExdQ0XcLceHYo1WFGww3K
spring.security.oauth2.client.registration.my-oidc-client.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.my-oidc-client.client-authentication-method=client_secret_basic
# Must match server scopes
spring.security.oauth2.client.registration.my-oidc-client.scope=openid,user.read

# Redirect URI where oauth_server sends the authorization code.
# Must match what you configured in oauth_server.
# Redirect URI placeholder form (expands to http://localhost:8081/login/oauth2/code/spring)
#spring.security.oauth2.client.registration.my-oidc-client.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.my-oidc-client.redirect-uri=http://localhost:8081/login/oauth2/code/my-oidc-client

# Redirect URI where oauth_server sends the authorization code.
# Must match what you configured in oauth_server.
# this is i think wrong configuration this is not according to tutorial
#spring.security.oauth2.client.registration.spring.redirect-uri=http://localhost:8081/login/oauth2/code/spring


# ===============================
# PERFORMANCE
# ===============================
# if we want to make it scalable fast
# Enables virtual threads (good for scalability)
# Java 21 feature: virtual threads allow more concurrent requests efficiently.
spring.threads.virtual.enabled=true


# ===============================
# SESSION COOKIE CONFIG
# ===============================
server.servlet.session.cookie.name=CLIENTSESSIONID
server.servlet.session.cookie.http-only=true
# secure=false is fine for dev, but set true in production with HTTPS.
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.path=/
server.servlet.session.cookie.same-site=lax
# 3600 means 1hr and 300 means 5min
server.servlet.session.cookie.max-age=300
# server deletes session after 3 minutes of inactivity
server.servlet.session.timeout=3m
























