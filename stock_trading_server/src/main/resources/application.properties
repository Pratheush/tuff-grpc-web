# # Name of this Spring Boot app (used in logs, context)
spring.application.name=stock_trading_server

# Database connection details (same DB as oauth_server, so both can share user/stock data)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://172.26.238.72:5432/user_service_db
spring.datasource.username=user_service_user
spring.datasource.password=userpass

# JPA/Hibernate settings: auto-update schema, show SQL, use PostgreSQL dialect, keep entity field names as-is
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# gRPC server runs on port 9090
spring.grpc.server.port=9090


# enabling this configuration then only we can test our app through postman or any third party command line tool
# Enables gRPC reflection (so tools like Postman or grpcurl can discover services/methods)
spring.grpc.server.reflection.enabled=true

# Actuator for observability
# Expose all actuator endpoints, show full health details
# actuator for health check endpoint OBSERVABILITY
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always


# ===============================
# OAUTH2 RESOURCE SERVER (JWT)
# ===============================
# Resource server validates JWTs issued by oauth_server.
# ?? Correction: issuer-uri should be the issuer (http://localhost:8082), not the jwks endpoint.
# jwk-set-uri points to keys, issuer-uri points to the server identity.
# using BOTH jwk-set-uri + issuer-uri ? Not recommended ? Use ONLY ONE ? Best practice: spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8082
#spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8082/oauth2/jwks
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8082

# ===============================
# PERFORMANCE
# ===============================
# if we want to make it scalable fast
# Enable virtual threads for scalability
spring.threads.virtual.enabled=true

# ===============================
# LOGGING
# ===============================
# Debug logs for security
logging.level.org.springframework.security=DEBUG